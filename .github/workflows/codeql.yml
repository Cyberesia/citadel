name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-14
    timeout-minutes: 120

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare signing stubs for CI
        env:
          TEAM_ID: XXXXXXXXXX
        run: |
          echo "TEAM_ID=$TEAM_ID" > Scripts/signing.local.env
          chmod +x Scripts/prepare-signing.sh
          ./Scripts/prepare-signing.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift

      - name: Build for CodeQL
        env:
          SKIP_COWORKCORE: "1"
        run: |
          xcodebuild \
            -scheme Citadel \
            -configuration Debug \
            -derivedDataPath build \
            -skipMacroValidation \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
