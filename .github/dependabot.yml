version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: swift
    directory: /Citadel.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - swiftpm
    groups:
      mlx:
        patterns:
          - "mlx-*"
      huggingface:
        patterns:
          - "swift-huggingface"
          - "swift-transformers"
          - "swift-transformers-*"
